<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به DrugSafe</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="login.html">
      <span class="brand-icon">D</span>
      <span><strong>DrugSafe</strong><small>مدیریت اطلاعات دارویی</small></span>
    </a>
    <div class="auth-heading">
      <span class="auth-eyebrow">پنل امن داروخانه</span>
      <h1>ورود به حساب کاربری</h1>
      <p>برای ادامه، اطلاعات حساب کاربری خود را وارد کنید.</p>
    </div>
    <form id="loginForm" class="auth-form">
      <label for="email">ایمیل</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required maxlength="255" />
      <label for="password">رمز عبور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="رمز عبور خود را وارد کنید" required maxlength="72" />
      <p id="loginMessage" class="form-message" role="alert"></p>
      <button id="loginButton" class="primary-btn auth-submit" type="submit">ورود به پنل <span>←</span></button>
    </form>
    <p class="auth-note">ایجاد حساب کاربری فقط توسط مدیر سیستم انجام می‌شود.</p>
  </main>
  <script src="./js/config.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
